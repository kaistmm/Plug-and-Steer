#### general settings
name: MossFormer2
num_spks: 3

### DDP settings; node1 is master node
DDP:
  port: 23654
  backend: nccl
  devices:
    node1:
      ip: localhost
      gpus: []
      batch_size: 1  # effective batch size per GPU is batchsize * (grad_accum_num)


#### datasets
datasets:
  train:
    dataset:
      name: Librimix
      config:
        mix_scp: ./data/librimix/libri3mix_100/tr_mix.scp
        target_scp: [./data/librimix/libri3mix_100/tr_s1.scp, ./data/librimix/libri3mix_100/tr_s2.scp, ./data/librimix/libri3mix_100/tr_s3.scp]

        sample_rate: 16000
        chunk_size: 48000
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: true

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true
      drop_last: true         # keeps every accumulation window full

  validation:
    dataset:
      name: Librimix
      config:
        mix_scp: ./data/librimix/libri3mix_100/tt_mix.scp
        target_scp: [./data/librimix/libri3mix_100/tt_s1.scp, ./data/librimix/libri3mix_100/tt_s2.scp, ./data/librimix/libri3mix_100/tt_s3.scp]

        sample_rate: 16000
        chunk_size: -1  # full utterance
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: false

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true


#### network structures
model:
  name: MossFormer2
  config:
    in_channels: 512
    out_channels: 512
    num_blocks: 24
    kernel_size: 16
    norm: "ln"
    num_spks: 3
    skip_around_intra: true
    use_global_pos_enc: true
    max_length: 20000

#### training settings: learning rate scheme, loss
trainer:
  name: basic_separation_trainer
  seed: 1234
  gpus_hint: 2
  precision_mode: fp32  # fp32(default), bf16-mixed, fp16-mixed
  precision_inference: true    # use amp during inference
  epoch: 2000
  early_stop: 2000
  clip_norm: 5
  grad_accum_num: 2  # effective batch size per GPU is batchsize * (grad_accum_num)
  loss:
    name: SISNR_PIT
    config:
  keep_last_ckpt: 10

#### Optimizer settings
optim:
  name: Adam
  config:
    lr: 0.0005
    weight_decay: 0

#### scheduler settings
scheduler:
  name: ReduceLROnPlateau
  loss_pass: true
  call_step: epoch
  config:
    factor: 0.5
    patience: 3
    # Only an improvement of >= 0.01 dB counts. torch's default rel mode is
    # wrong-signed on negative SI-SNR losses and lets noise reset patience.
    threshold_mode: abs
    threshold: 0.01


#### Resume training settings
checkpoint:
  resume:
    enable: true
    type: last  # last or best
    only_model: false  # only load model weights


#### logging by tensorboard
logging:
  name: logger
  log_level: INFO
  log_freq: 100
  tensorboard: true
