#### TFGridNetV1 audio-only pre-training on lrs2_2mix
#
# ao_pt: reproduces the paper's ReduceLROnPlateau schedule, as opposed to the
# `ao_pt_cosine` set, which swaps in a fixed-step cosine budget. Same model, same
# data, same optimizer -- only the learning-rate schedule differs.
#
# Recovered from the config.yaml saved by the run that produced
#   exps/in26/tfgridnet-lrs2-ao_pt-base/ckpt/best.pt
# Its data and model settings are that run's; the schedule, precision and learning
# rate were later aligned with the ao_pt_cosine set, so the two now differ only by
# the schedule itself.
#
#   corpus      LRS2-2mix, the in-the-wild corpus the AV stages train on
#   batch       2 per GPU x 2 GPUs x accum 1 = 4 effective
#   precision   bf16-mixed

#### general settings
name: TFGridNetV1
num_spks: 2

### DDP settings; node1 is master node
DDP:
  port: 23706
  backend: nccl
  devices:
    node1:
      ip: localhost
      gpus: []
      batch_size: 2  # effective batch size per GPU is batchsize * (grad_accum_num)


#### datasets
datasets:
  train:
    dataset:
      name: LRS2mix
      config:
        mix_scp: ./data/lrs2_2mix/tr_mix.scp
        target_scp: [./data/lrs2_2mix/tr_s1.scp, ./data/lrs2_2mix/tr_s2.scp]
        sample_rate: 16000
        chunk_size: 48000
        debug_mode: false
        normalize: true
        return_video: false

    sampler:
      name: DDP_sampler
      config:
        shuffle: true

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true
      drop_last: true         # keeps every accumulation window full

  validation:
    dataset:
      name: LRS2mix
      config:
        mix_scp: ./data/lrs2_2mix/tt_mix.scp
        target_scp: [./data/lrs2_2mix/tt_s1.scp, ./data/lrs2_2mix/tt_s2.scp]
        sample_rate: 16000
        chunk_size: -1  # full utterance
        debug_mode: false
        normalize: true
        return_video: false

    sampler:
      name: DDP_sampler
      config:
        shuffle: false

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true


#### network structures
model:
  name: TFGridNetV1
  config:
    n_srcs: 2
    n_fft: 512
    stride: 128
    window: "hann"
    n_imics: 1
    n_layers: 6
    lstm_hidden_units: 256
    attn_n_head: 4
    attn_approx_qk_dim: 512
    emb_dim: 32
    emb_ks: 8
    emb_hs: 1
    activation: "prelu"
    eps: 0.00001
    use_builtin_complex: false
    ref_channel: -1

#### training settings: learning rate scheme, loss
trainer:
  name: basic_separation_trainer
  seed: 1234
  precision_mode: "bf16-mixed"
  # The original run left precision_mode unset, i.e. fp32. Kept as-is so the
  # reproduction is comparable to the archived best_loss.
  precision_inference: true
  # ReduceLROnPlateau has no step budget, so `epoch` only has to be large enough
  # that the job never exits on its own and releases the GPU reservation.
  epoch: 2000
  early_stop: 2000
  clip_norm: 5
  grad_accum_num: 1  # effective batch size per GPU is batchsize * (grad_accum_num)
  gpus_hint: 2  # GPU count the archived run used; gen_run_scripts.py reads this
  loss:
    name: SISNR_PIT
    config:
  keep_last_ckpt: 10

#### Optimizer settings
optim:
  name: Adam
  config:
    lr: 0.0005
    weight_decay: 0

#### scheduler settings
scheduler:
  name: ReduceLROnPlateau
  loss_pass: true
  call_step: epoch
  config:
    factor: 0.5
    patience: 3
    # Only an improvement of >= 0.01 dB counts. torch's default rel mode is
    # wrong-signed on negative SI-SNR losses and lets noise reset patience.
    # The original run did not set this; it is a bug fix, so the lr will decay
    # earlier here than it did in the archived run.
    threshold_mode: abs
    threshold: 0.01


#### Resume training settings
checkpoint:
  resume:
    enable: true
    type: last  # last or best
    only_model: false  # only load model weights

#### logging by tensorboard
logging:
  name: logger
  log_level: INFO
  log_freq: 100
  tensorboard: true
