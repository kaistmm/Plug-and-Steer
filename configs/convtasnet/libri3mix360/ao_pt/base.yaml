#### general settings
name: ConvTasnet
num_spks: 3

### DDP settings; node1 is master node
DDP:
  port: 23533
  backend: nccl
  devices:
    node1:
      ip: localhost
      gpus: []
      batch_size: 4  # effective batch size per GPU is batchsize * (grad_accum_num)


#### datasets
datasets:
  train:
    dataset:
      name: Librimix
      config:
        mix_scp: ./data/librimix/libri3mix/tr_mix.scp
        target_scp: [./data/librimix/libri3mix/tr_s1.scp, ./data/librimix/libri3mix/tr_s2.scp, ./data/librimix/libri3mix/tr_s3.scp]

        sample_rate: 16000
        chunk_size: 48000
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: true

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true
      drop_last: true         # keeps every accumulation window full

  validation:
    dataset:
      name: Librimix
      config:
        mix_scp: ./data/librimix/libri3mix/tt_mix.scp
        target_scp: [./data/librimix/libri3mix/tt_s1.scp, ./data/librimix/libri3mix/tt_s2.scp, ./data/librimix/libri3mix/tt_s3.scp]

        sample_rate: 16000
        chunk_size: -1  # full utterance
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: false

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true


#### network structures
model:
  name: ConvTasnet
  config:
    num_sources: 3
    enc_kernel_size: 16
    enc_num_feats: 512
    msk_kernel_size: 3
    msk_num_feats: 128
    msk_num_hidden_feats: 512
    msk_num_layers: 8
    msk_num_stacks: 3
    msk_activate: 'relu'

#### training settings: learning rate scheme, loss
trainer:
  name: basic_separation_trainer
  seed: 1234
  gpus_hint: 1
  precision_mode: fp32  # fp32(default), bf16-mixed, fp16-mixed
  precision_inference: true    # use amp during inference
  epoch: 2000
  early_stop: 2000
  clip_norm: 5
  grad_accum_num: 1  # effective batch size per GPU is batchsize * (grad_accum_num)
  loss:
    name: SISNR_PIT
    config:
  keep_last_ckpt: 10

#### Optimizer settings
optim:
  name: Adam
  config:
    lr: 0.0005
    weight_decay: 0

#### scheduler settings
scheduler:
  name: ReduceLROnPlateau
  loss_pass: true
  call_step: epoch
  config:
    factor: 0.5
    patience: 3
    # Only an improvement of >= 0.01 dB counts. torch's default rel mode is
    # wrong-signed on negative SI-SNR losses and lets noise reset patience.
    threshold_mode: abs
    threshold: 0.01


#### Resume training settings
checkpoint:
  resume:
    enable: true
    type: last  # last or best
    only_model: false  # only load model weights


#### logging by tensorboard
logging:
  name: logger
  log_level: INFO
  log_freq: 100
  tensorboard: true
