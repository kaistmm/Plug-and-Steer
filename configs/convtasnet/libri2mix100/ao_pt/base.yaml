#### ConvTasnet audio-only pre-training on libri2mix_100
#
# ao_pt: reproduces the paper's ReduceLROnPlateau schedule, as opposed to the
# `ao_pt_cosine` set, which swaps in a fixed-step cosine budget. Same model, same
# data, same optimizer -- only the learning-rate schedule differs.
#
# Recovered from the config.yaml saved by the run that produced
#   exps/in26/convtasnet-libri2mix100-ao_pt-base/ckpt/best.pt
# Its data and model settings are that run's; the schedule, precision and learning
# rate were later aligned with the ao_pt_cosine set, so the two now differ only by
# the schedule itself.
#
#   corpus      Libri2Mix train-100 (~58 h), 13,900 utterances
#   batch       4 per GPU x 1 GPU x accum 1 = 4 effective
#   precision   fp32

#### general settings
name: ConvTasnet
num_spks: 2

### DDP settings; node1 is master node
DDP:
  port: 23500
  backend: nccl
  devices:
    node1:
      ip: localhost
      gpus: []
      batch_size: 4  # effective batch size per GPU is batchsize * (grad_accum_num)


#### datasets
datasets:
  train:
    dataset:
      name: Librimix
      config:
        mix_scp: ./data/librimix/tr_mix.scp
        target_scp: [./data/librimix/tr_s1.scp, ./data/librimix/tr_s2.scp]
        sample_rate: 16000
        chunk_size: 48000
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: true

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true
      drop_last: true         # keeps every accumulation window full

  validation:
    dataset:
      name: Librimix
      config:
        mix_scp: ./data/librimix/tt_mix.scp
        target_scp: [./data/librimix/tt_s1.scp, ./data/librimix/tt_s2.scp]
        sample_rate: 16000
        chunk_size: -1  # full utterance
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: false

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true


#### network structures
model:
  name: ConvTasnet
  config:
    num_sources: 2
    enc_kernel_size: 16
    enc_num_feats: 512
    msk_kernel_size: 3
    msk_num_feats: 128
    msk_num_hidden_feats: 512
    msk_num_layers: 8
    msk_num_stacks: 3
    msk_activate: 'relu'

#### training settings: learning rate scheme, loss
trainer:
  name: basic_separation_trainer
  seed: 1234
  precision_mode: fp32
  # The original run left precision_mode unset, i.e. fp32. Kept as-is so the
  # reproduction is comparable to the archived best_loss.
  precision_inference: true
  # ReduceLROnPlateau has no step budget, so `epoch` only has to be large enough
  # that the job never exits on its own and releases the GPU reservation.
  epoch: 2000
  early_stop: 2000
  clip_norm: 5
  grad_accum_num: 1  # effective batch size per GPU is batchsize * (grad_accum_num)
  gpus_hint: 1  # GPU count the archived run used; gen_run_scripts.py reads this
  loss:
    name: SISNR_PIT
    config:
  keep_last_ckpt: 10

#### Optimizer settings
optim:
  name: Adam
  config:
    lr: 0.0005
    weight_decay: 0

#### scheduler settings
scheduler:
  name: ReduceLROnPlateau
  loss_pass: true
  call_step: epoch
  config:
    factor: 0.5
    patience: 3
    # Only an improvement of >= 0.01 dB counts. torch's default rel mode is
    # wrong-signed on negative SI-SNR losses and lets noise reset patience.
    # The original run did not set this; it is a bug fix, so the lr will decay
    # earlier here than it did in the archived run.
    threshold_mode: abs
    threshold: 0.01


#### Resume training settings
checkpoint:
  resume:
    enable: true
    type: last  # last or best
    only_model: false  # only load model weights

#### logging by tensorboard
logging:
  name: logger
  log_level: INFO
  log_freq: 100
  tensorboard: true
