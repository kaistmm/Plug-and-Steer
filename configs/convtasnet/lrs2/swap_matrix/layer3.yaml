#### general settings
name: ConvTasnet
num_spks: 2

### DDP settings; node1 is master node
DDP:
  port: 23557
  backend: nccl
  devices:
    node1:
      ip: localhost
      gpus: []
      batch_size: 4  # effective batch size per GPU is batchsize * (grad_accum_num)


#### datasets
datasets:
  train:
    dataset:
      name: LRS2mix
      config:
        mix_scp: ./data/lrs2_2mix/tr_mix.scp
        target_scp: [./data/lrs2_2mix/tr_s1.scp, ./data/lrs2_2mix/tr_s2.scp]
        sample_rate: 16000
        chunk_size: 32000
        debug_mode: false

    sampler:
      name: DDP_sampler
      config:
        shuffle: true

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true

  validation:
    dataset:
      name: LRS2mix
      config:
        mix_scp: ./data/lrs2_2mix/tt_mix.scp
        target_scp: [./data/lrs2_2mix/tt_s1.scp, ./data/lrs2_2mix/tt_s2.scp]
        sample_rate: 16000
        chunk_size: -1  # full utterance
        debug_mode: false

    sampler:
      name: DDP_sampler
      config:
        shuffle: false

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true


#### network structures
model:
  name: ConvTasnet_swap
  config:
    num_sources: 2
    enc_kernel_size: 16
    enc_num_feats: 512
    msk_kernel_size: 3
    msk_num_feats: 128
    msk_num_hidden_feats: 512
    msk_num_layers: 8
    msk_num_stacks: 3
    msk_activate: 'relu'
    ckpt_path: exps/in26/convtasnet-lrs2-ao_pt-base/ckpt/best.pt
    freeze: true
    swap_layer: 3


#### training settings: learning rate scheme, loss
trainer:
  name: basic_separation_trainer_swap
  epoch: 2000
  early_stop: 2000
  clip_norm: 5
  grad_accum_num: 1  # effective batch size per GPU is batchsize * (grad_accum_num)
  regularization:
  regularization_weight:
  loss:
    name: SISNR
    config:
  keep_last_ckpt: 10

#### Optimizer settings
optim:
  name: Adam
  config:
    lr: 0.0005
    weight_decay: 0

#weight_decay: 0.00001
##clip_norm: 5
##momentum: 0

#### scheduler settings
scheduler:
  name: CosineAnnealingLR
  loss_pass: false
  call_step: iteration  # epoch or iteration
  config:
    num_warmup_steps: 0 # The number of steps for the warmup phase
    num_training_steps: 10033  #The total number of training steps.
    num_cycles: 1 # The number of hard restarts to use. (3 to prevent early stop)

#### Resume training settings
checkpoint:
  resume:
    enable: false
    type: last  # last or best
    only_model: false  # only load model weights

#### logging by tensorboard
logging:
  name: logger
  log_level: INFO
  log_freq: 100
  tensorboard: true
