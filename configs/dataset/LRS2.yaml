#### general settings
name: TFGridNetV1
num_spks: 2

### DDP settings; node1 is master node
DDP:
  port: 23247
  backend: nccl
  devices:
    node1:
      ip: localhost
      gpus: []
      batch_size: 1  # effective batch size per GPU is batchsize * (grad_accum_num)


#### datasets
datasets:
  train:
    dataset:
      name: LRS2mix
      config:
        mix_scp: ./data/lrs2_2mix/tr_mix.scp
        target_scp: [./data/lrs2_2mix/tr_s1.scp, ./data/lrs2_2mix/tr_s2.scp]
        sample_rate: 16000
        chunk_size: 48000
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: true

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true

  validation:
    dataset:
      name: LRS2mix
      config:
        mix_scp: ./data/lrs2_2mix/tt_mix.scp
        target_scp: [./data/lrs2_2mix/tt_s1.scp, ./data/lrs2_2mix/tt_s2.scp]
        sample_rate: 16000
        chunk_size: -1  # full utterance
        debug_mode: false
        normalize: true

    sampler:
      name: DDP_sampler
      config:
        shuffle: false

    loader:
      shuffle: false
      num_workers: 4  # per GPU
      pin_memory: true


#### network structures
model:
  name: DPRNN
  config:
    in_channels: 256
    out_channels: 64
    hidden_channels: 128
    kernel_size: 2
    rnn_type: LSTM
    norm: ln
    dropout: 0
    bidirectional: true
    num_layers: 6
    K: 250
    num_spks: 2


#### training settings: learning rate scheme, loss
trainer:
  name: basic_separation_trainer
  epoch: 2000
  early_stop: 2000
  clip_norm: 5
  grad_accum_num: 1  # effective batch size per GPU is batchsize * (grad_accum_num)
  loss:
    name: SISNR_PIT
    config:
  keep_last_ckpt: 10

#### Optimizer settings
optim:
  name: Adam
  config:
    lr: 0.0005
    weight_decay: 0

#weight_decay: 0.00001
##clip_norm: 5
##momentum: 0

#### scheduler settings
scheduler:
  name: ReduceLROnPlateau
  loss_pass: true
  call_step: epoch
  config:
    factor: 0.5
    patience: 3
    # Only an improvement of >= 0.01 dB counts. torch's default rel mode is
    # wrong-signed on negative SI-SNR losses and lets noise reset patience.
    threshold_mode: abs
    threshold: 0.01


#### Resume training settings
checkpoint:
  resume:
    enable: true
    type: last  # last or best
    only_model: false  # only load model weights

#### logging by tensorboard
logging:
  name: logger
  log_level: INFO
  log_freq: 100
  tensorboard: true
